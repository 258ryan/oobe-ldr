name: Build Windows binaries

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install MinGW-w64
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends gcc-mingw-w64-x86-64

      - name: Build Windows binaries
        run: |
          mkdir -p dist
          x86_64-w64-mingw32-gcc -O2 -Wall -Werror -mwindows -municode -static \
            -o dist/oobelaunch.exe oobelaunch.c -lwtsapi32 -luserenv
          x86_64-w64-mingw32-gcc -O2 -Wall -Werror -shared \
            -o dist/winbrand.dll winbrand_proxy.c winbrand.def -static-libgcc -lkernel32 -lgdi32
          x86_64-w64-mingw32-gcc -O2 -Wall -Werror -mwindows -municode -static \
            -o dist/oobesetup.exe oobesetup.c

      - name: Verify PE outputs
        run: |
          file dist/oobelaunch.exe dist/oobesetup.exe dist/winbrand.dll
          file runtime/DUser.dll runtime/dui72.dll
          x86_64-w64-mingw32-objdump -p dist/oobelaunch.exe | grep -q 'pei-x86-64'
          x86_64-w64-mingw32-objdump -p dist/oobesetup.exe | grep -q 'pei-x86-64'
          x86_64-w64-mingw32-objdump -p dist/winbrand.dll | grep -q 'pei-x86-64'
          x86_64-w64-mingw32-objdump -p runtime/DUser.dll | grep -q 'pei-x86-64'
          x86_64-w64-mingw32-objdump -p runtime/dui72.dll | grep -q 'pei-x86-64'
          x86_64-w64-mingw32-objdump -p dist/winbrand.dll | grep -q 'BrandingLoadBitmap'

      - name: Assemble setup kit
        run: |
          mkdir -p dist/kit/runtime
          cp dist/oobelaunch.exe dist/oobesetup.exe dist/winbrand.dll dist/kit/
          cp prepare-vista-oobe.bat install-system-msoobe.ps1 \
            restore-system-msoobe.bat restore-system-msoobe.ps1 README.md dist/kit/
          cp runtime/DUser.dll runtime/dui72.dll dist/kit/runtime/
          if [ -d branding ]; then cp -R branding dist/kit/; fi
          (cd dist/kit && zip -qr ../vista-oobe-kit.zip .)

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vista-oobe-kit
          path: dist/vista-oobe-kit.zip
          if-no-files-found: error
